name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - uses: julia-actions/cache@v3

      - name: Run tests
        env:
          PQJULIA_LONG_TESTS: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
        run: julia --project=. -e 'using Pkg; Pkg.test()'
